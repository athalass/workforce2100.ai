<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workforce 2100 — Back shortly</title>
<meta name="description" content="Workforce 2100 is being updated and will be back shortly.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F1B2D;--teal:#0E7C66;--ink:#16202A;--ink-2:#46525E;--line:#DDE3E9;--bg:#F6F8FA}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{background:var(--navy);padding:18px 16px}
.brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:600;font-size:18px;max-width:960px;margin:0 auto;width:100%}
.brand b{color:#7FD1BC;font-weight:600}
.hdr{max-width:960px;margin:0 auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:44px 40px;max-width:620px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(15,27,45,.06)}
.bars{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:44px;margin:0 auto 22px}
.bars i{display:block;width:12px;border-radius:3px;animation:rise 1.6s ease-in-out infinite}
.bars i:nth-child(1){height:20px;background:#7FD1BC}
.bars i:nth-child(2){height:30px;background:#35A88C;animation-delay:.2s}
.bars i:nth-child(3){height:42px;background:var(--navy);animation-delay:.4s}
@keyframes rise{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}
@media (prefers-reduced-motion:reduce){.bars i{animation:none}}
.eyebrow{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,38px);line-height:1.15;margin:0 0 14px}
p{margin:0 0 12px;color:var(--ink-2)}
.contact{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}
a{color:var(--teal)}
footer{text-align:center;font-size:13px;color:var(--ink-2);padding:20px 16px}
</style>
</head>
<body>
<header><div class="hdr"><a class="brand" href="/" aria-label="Workforce 2100 home">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#16263D"/><rect x="6" y="15" width="4" height="7" rx="1" fill="#7FD1BC"/><rect x="12" y="10" width="4" height="12" rx="1" fill="#35A88C"/><rect x="18" y="5" width="4" height="17" rx="1" fill="#fff"/></svg>
<span>Workforce 2100<b>.ai</b></span></a></div></header>
<main>
<div class="card" role="status">
<div class="bars" aria-hidden="true"><i></i><i></i><i></i></div>
<p class="eyebrow">Updating</p>
<h1>We'll be back shortly</h1>
<p>We're updating the site with new data and reports. Thank you for your patience.</p>
<p class="contact">Questions? Email <a href="mailto:info@workforce2100.ai">info@workforce2100.ai</a>.</p>
</div>
</main>
<footer>© 2026 Horizon 2100 LLC · Workforce 2100</footer>
</body>
</html>
